# Render Blueprint — single container (PHP-FPM + Nginx) + managed PostgreSQL.
# Render → New → Blueprint → select this repository.

#
# Names match the existing Render resources (created for v1), so syncing this
# Blueprint updates egg-sales-system in place and keeps the egg-sales-db data.

services:
  - type: web
    name: egg-sales-system
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: egg-sales-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Africa/Dar_es_Salaam
      - key: ADMIN_RECOVERY_CODE
        sync: false
      - key: ADMIN_IDLE_TIMEOUT
        value: "120"

databases:
  - name: egg-sales-db
    plan: free
    region: frankfurt
    databaseName: egg_sales_system
    user: egg_sales_user
