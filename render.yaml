# Render Blueprint — single container (PHP-FPM + Nginx) + managed PostgreSQL.
# Render → New → Blueprint → select this repository.

services:
  - type: web
    name: agizapoa
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agizapoa-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Africa/Dar_es_Salaam
      - key: ADMIN_RECOVERY_CODE
        sync: false
      - key: ADMIN_IDLE_TIMEOUT
        value: "120"

databases:
  - name: agizapoa-db
    plan: free
    region: frankfurt
    databaseName: agizapoa
    user: agizapoa
