services:
  - type: web
    name: egg-sales-system
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: egg-sales-db
          property: connectionString

databases:
  - name: egg-sales-db
    plan: free
    region: frankfurt
    databaseName: egg_sales_system
    user: egg_sales_user
