<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    # Public customer portal: keep /shop in the browser URL while
    # internally serving the real customer_portal files.
    RewriteRule ^/shop/?$ /customer_portal/index.php [END]
    RewriteRule ^/shop/(.*)$ /customer_portal/$1 [END]

    # Public admin entry.
    RewriteRule ^/admin/?$ /admin_entry/index.php [END]

    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
