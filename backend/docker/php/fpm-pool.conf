; PHP-FPM pool tuning (overrides the image's default [www] pool).
[www]
; Keep container environment variables (DATABASE_URL, APP_ENV, ...) visible to PHP.
clear_env = no

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 75s
