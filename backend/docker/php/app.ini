; Application PHP settings (loaded after php.ini-production).

expose_php = Off
memory_limit = 128M
max_execution_time = 60
max_input_time = 60

; Uploads (login slideshow images up to 6 MB)
file_uploads = On
upload_max_filesize = 8M
post_max_size = 12M

; Errors are logged to the container output, never shown to users
display_errors = Off
log_errors = On

; Sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 28800

; OPcache — compiled PHP stays in memory between requests
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
